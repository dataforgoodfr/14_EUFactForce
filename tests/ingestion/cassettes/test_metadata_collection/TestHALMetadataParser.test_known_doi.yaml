        scheme=\\\"halTreeTypology\\\" n=\\\"ART\\\">Journal articles</classCode>
        \           </textClass>            <abstract xml:lang=\\\"en\\\">              <p>BACKGROUND:
        The use of the internet to look for information about vaccines has skyrocketed
        in the last years, especially with the COVID-19 pandemic. Digital vaccine
        literacy (DVL) refers to understanding, trust, appraisal, and application
        of vaccine-related information online. OBJECTIVE: This study aims to develop
        a tool measuring DVL and assess its psychometric properties. METHODS: A 7-item
        online questionnaire was administered to 848 French adults. Different psychometric
        analyses were performed, including descriptive statistics, exploratory factor
        analysis, confirmatory factor analysis, and convergent and discriminant validity.
        RESULTS: We developed the 7-item DVL scale composed of 3 factors (understanding
        and trust official information; understanding and trust information in social
        media; and appraisal of vaccine information online in terms of evaluation
        of the information and its application for decision making). The mean DVL
        score of the baseline sample of 848 participants was 19.5 (SD 2.8) with a
        range of 7-28. The median score was 20. Scores were significantly different
        by gender (P=.24), age (P=.03), studying or working in the field of health
        (P=.01), and receiving regular seasonal flu shots (P=.01). CONCLUSIONS: The
        DVL tool showed good psychometric proprieties, resulting in a promising measure
        of DVL.</p>            </abstract>          </profileDesc>        </biblFull>
